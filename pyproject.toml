[project]
name = "formex"
version = "0.1.0"
description = "Terminal-based symbolic differentiation engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "windows-curses; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
formex = "formex.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
